<!doctype html>
<html lang="es">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Familia Ponquesito · Enlaces</title>
  <meta name="description" content="Pide por WhatsApp, visita nuestro Instagram o encuentra Familia Ponquesito en Barquisimeto.">
  <meta name="theme-color" content="#fff8ed">
  <link rel="icon" type="image/svg+xml" href="./favicon.svg">
  <style>
    :root {
      color-scheme: light;
      --cream: #fff8ed;
      --paper: #fffdf9;
      --terracotta: #c96f53;
      --terracotta-dark: #a94f37;
      --charcoal: #2e2929;
      --muted: #716865;
      --line: rgba(201, 111, 83, 0.24);
      --shadow: 0 24px 70px rgba(72, 41, 32, 0.16);
    }

    * { box-sizing: border-box; }

    html { min-height: 100%; background: var(--cream); }

    body {
      min-height: 100vh;
      margin: 0;
      display: grid;
      place-items: center;
      padding: 28px 16px;
      color: var(--charcoal);
      font-family: Inter, ui-sans-serif, system-ui, -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
      background:
        radial-gradient(circle at 12% 14%, rgba(201, 111, 83, 0.20), transparent 24rem),
        radial-gradient(circle at 88% 90%, rgba(169, 79, 55, 0.15), transparent 26rem),
        linear-gradient(145deg, #fffaf1 0%, #f8e9dc 100%);
    }

    main {
      width: min(100%, 440px);
      position: relative;
    }

    .card {
      position: relative;
      overflow: hidden;
      padding: 30px 22px 24px;
      border: 1px solid rgba(255, 255, 255, 0.78);
      border-radius: 32px;
      background: rgba(255, 253, 249, 0.93);
      box-shadow: var(--shadow);
      backdrop-filter: blur(12px);
    }

    .card::before {
      content: "";
      position: absolute;
      inset: 0 0 auto;
      height: 7px;
      background: linear-gradient(90deg, var(--terracotta-dark), #e3a07f, var(--terracotta));
    }

    .brand {
      display: grid;
      justify-items: center;
      text-align: center;
    }

    .logo-wrap {
      width: 148px;
      aspect-ratio: 1;
      display: grid;
      place-items: center;
      overflow: hidden;
      border: 1px solid var(--line);
      border-radius: 50%;
      background: var(--cream);
      box-shadow: 0 12px 30px rgba(86, 46, 34, 0.12);
    }

    .logo-wrap img {
      width: 100%;
      height: 100%;
      object-fit: cover;
      transform: scale(1.03);
    }

    h1 {
      margin: 20px 0 4px;
      font-family: Georgia, "Times New Roman", serif;
      font-size: clamp(1.9rem, 7vw, 2.45rem);
      font-weight: 500;
      line-height: 1.05;
      letter-spacing: -0.035em;
    }

    .tagline {
      margin: 0;
      color: var(--terracotta-dark);
      font-family: Georgia, "Times New Roman", serif;
      font-size: 1rem;
      font-style: italic;
    }

    .links {
      display: grid;
      gap: 12px;
      margin-top: 28px;
    }

    .link {
      min-height: 62px;
      display: grid;
      grid-template-columns: 42px 1fr 24px;
      align-items: center;
      gap: 12px;
      padding: 10px 14px;
      border: 1px solid var(--line);
      border-radius: 18px;
      color: var(--charcoal);
      text-decoration: none;
      background: var(--paper);
      box-shadow: 0 7px 18px rgba(86, 46, 34, 0.07);
      transition: transform 160ms ease, border-color 160ms ease, box-shadow 160ms ease;
    }

    .link:hover {
      transform: translateY(-2px);
      border-color: rgba(201, 111, 83, 0.58);
      box-shadow: 0 11px 24px rgba(86, 46, 34, 0.12);
    }

    .link:focus-visible {
      outline: 3px solid rgba(201, 111, 83, 0.38);
      outline-offset: 3px;
    }

    .link.primary {
      color: #fff;
      border-color: transparent;
      background: linear-gradient(135deg, var(--terracotta-dark), var(--terracotta));
      box-shadow: 0 12px 26px rgba(169, 79, 55, 0.25);
    }

    .icon {
      width: 42px;
      height: 42px;
      display: grid;
      place-items: center;
      border-radius: 13px;
      color: var(--terracotta-dark);
      background: #f8e5d9;
    }

    .primary .icon {
      color: #fff;
      background: rgba(255, 255, 255, 0.16);
    }

    .icon svg { width: 22px; height: 22px; }

    .link-copy {
      min-width: 0;
      display: grid;
      gap: 2px;
    }

    .link-copy strong {
      font-size: 1rem;
      font-weight: 750;
      line-height: 1.2;
    }

    .link-copy small {
      overflow: hidden;
      color: var(--muted);
      font-size: 0.78rem;
      line-height: 1.3;
      text-overflow: ellipsis;
      white-space: nowrap;
    }

    .primary .link-copy small { color: rgba(255, 255, 255, 0.79); }

    .chevron {
      color: currentColor;
      opacity: 0.55;
    }

    footer {
      margin-top: 24px;
      padding-top: 20px;
      border-top: 1px solid var(--line);
      text-align: center;
    }

    address {
      color: var(--muted);
      font-size: 0.83rem;
      font-style: normal;
      line-height: 1.55;
    }

    @media (max-width: 360px) {
      body { padding-inline: 10px; }
      .card { padding-inline: 16px; border-radius: 26px; }
      .logo-wrap { width: 132px; }
      .link { grid-template-columns: 40px 1fr 20px; gap: 10px; padding-inline: 11px; }
      .icon { width: 40px; height: 40px; }
    }

    @media (prefers-reduced-motion: reduce) {
      .link { transition: none; }
    }
  </style>
</head>
<body>
  <main>
    <section class="card" aria-labelledby="brand-name">
      <header class="brand">
        <div class="logo-wrap">
          <img src="./assets/logo-familia-ponquesito.png" alt="Logo de Familia Ponquesito" width="148" height="148">
        </div>

      <nav class="links" aria-label="Enlaces de Familia Ponquesito">
        <a class="link primary" href="https://wa.me/584248532526?text=Hola%20Familia%20Ponquesito%2C%20quiero%20hacer%20un%20pedido." target="_blank" rel="noopener noreferrer">
          <span class="icon" aria-hidden="true">
            <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.9" stroke-linecap="round" stroke-linejoin="round"><path d="M21 11.5a8.4 8.4 0 0 1-9 8.4 9.4 9.4 0 0 1-3.9-.9L3 21l1.8-4.8a8.5 8.5 0 1 1 16.2-4.7Z"/><path d="M8.6 8.3c.2 2.9 2.2 5.2 5.1 6.2l1.4-1.5 2 .6"/></svg>

          <span class="link-copy">
            <strong>Pedir por WhatsApp</strong>
            <small>+58 424-8532526</small>
          </span>

        </a>

        <a class="link" href="https://www.instagram.com/familiaponquesito/" target="_blank" rel="noopener noreferrer">
          <span class="icon" aria-hidden="true">
            <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.9"><rect x="3" y="3" width="18" height="18" rx="5"/><circle cx="12" cy="12" r="4"/><circle cx="17.5" cy="6.5" r="1" fill="currentColor" stroke="none"/></svg>
          </span>
          <span class="link-copy">
            <strong>Ver Instagram</strong>
            <small>@familiaponquesito</small>
          </span>
          <span class="chevron" aria-hidden="true">›</span>
        </a>

        <a class="link" href="https://www.google.com/maps/search/?api=1&amp;query=Carrera%2019%20entre%20calles%208%20y%209%2C%20detr%C3%A1s%20del%20Rectorado%20de%20la%20UCLA%2C%20Barquisimeto%2C%20Lara%2C%20Venezuela" target="_blank" rel="noopener noreferrer">
          <span class="icon" aria-hidden="true">
            <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.9" stroke-linecap="round" stroke-linejoin="round"><path d="M20 10c0 5-8 11-8 11S4 15 4 10a8 8 0 1 1 16 0Z"/><circle cx="12" cy="10" r="2.5"/></svg>
          </span>
          <span class="link-copy">
            <strong>Cómo llegar</strong>
            <small>Carrera 19 entre 8 y 9</small>
          </span>
          <span class="chevron" aria-hidden="true">›</span>
        </a>
      </nav>

      <footer>
        <address>Carrera 19 entre calles 8 y 9<br>Detrás del Rectorado de la UCLA · Barquisimeto</address>
      </footer>
    </section>
  </main>
</body>
</html>
